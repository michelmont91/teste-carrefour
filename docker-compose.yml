version: '3.8'

services:
  # ==========================================
  # INFRAESTRUTURA
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: bc-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: fluxo_caixa_db
    ports:
      - "5432:5432"
    networks:
      - carrefour-net

  mongodb:
    image: mongo:7.0
    container_name: bc-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adminpassword
    ports:
      - "27017:27017"
    networks:
      - carrefour-net

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: bc-redpanda
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - carrefour-net

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.3
    container_name: bc-redpanda-init
    depends_on:
      - redpanda
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Aguardando o Redpanda iniciar...'
      sleep 5
      rpk topic create lancamentos-eventos --brokers redpanda:29092 --partitions 3 --replicas 1 || true
      rpk topic create lancamentos-dlq --brokers redpanda:29092 --partitions 1 --replicas 1 || true
      echo 'Topicos criados com sucesso!'
      "
    networks:
      - carrefour-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bc-kafka-ui
    depends_on:
      - redpanda
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banco-carrefour-redpanda
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:29092
    networks:
      - carrefour-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: bc-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - carrefour-net

  # ==========================================
  # MICROSSERVIÇOS .NET
  # ==========================================
  writeservice.api:
    build:
      context: .
      dockerfile: src/WriteService/WriteService.API/Dockerfile
    container_name: bc-writeservice-api
    depends_on:
      - postgres
      - redpanda
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres;Port=5432;Database=fluxo_caixa_db;Username=admin;Password=adminpassword
      - Kafka__BootstrapServers=redpanda:29092
      - Kafka__Topic=lancamentos-eventos
      - Keycloak__Authority=http://keycloak:8080/realms/banco-carrefour
    networks:
      - carrefour-net

  consolidation.worker:
    build:
      context: .
      dockerfile: src/ConsolidationWorker/Worker.Host/Dockerfile
    container_name: bc-consolidation-worker
    depends_on:
      - mongodb
      - redpanda
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:adminpassword@mongodb:27017
      - Kafka__BootstrapServers=redpanda:29092
      - Kafka__Topic=lancamentos-eventos
      - Kafka__DlqTopic=lancamentos-dlq
    networks:
      - carrefour-net

  readservice.consolidado.api:
    build:
      context: .
      dockerfile: src/ReadService.Consolidado/ReadService.Consolidado.API/Dockerfile
    container_name: bc-read-consolidado-api
    depends_on:
      - mongodb
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:adminpassword@mongodb:27017
      - Keycloak__Authority=http://keycloak:8080/realms/banco-carrefour
    networks:
      - carrefour-net

  readservice.extrato.api:
    build:
      context: .
      dockerfile: src/ReadService.Extrato/ReadService.Extrato.API/Dockerfile
    container_name: bc-read-extrato-api
    depends_on:
      - mongodb
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoDb=mongodb://admin:adminpassword@mongodb:27017
      - Keycloak__Authority=http://keycloak:8080/realms/banco-carrefour
    networks:
      - carrefour-net

networks:
  carrefour-net:
    driver: bridge